name: ci
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.2
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run melos bootstrap
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze --fatal-infos
      - run: dart run melos run test

  isolation-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: 3.41.2, channel: stable, cache: true }
      - run: bash tool/check_isolation.sh
      - run: flutter pub get
      - name: Release build must not contain mock storage
        working-directory: apps/patient_app
        run: |
          flutter build apk --release -t lib/main.dart --split-debug-info=build/symbols
          unzip -p build/app/outputs/flutter-apk/app-release.apk 'lib/*/libapp.so' > /tmp/libapp.bin
          if strings /tmp/libapp.bin | grep -qE 'InMemoryMockPatientRepository|DevMockPatientRecordRepository'; then
            echo 'Mock repository found in release build'; exit 1
          fi
